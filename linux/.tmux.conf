# ~/.tmux.conf — Windows Terminal-style bindings for Ptyxis on Ubuntu 26.04
#
# Reload after editing:  prefix + r   (or: tmux source ~/.tmux.conf)
# Prefix is still Ctrl+B — needed for copy mode and anything not bound below.
# ─────────────────────────────────────────────────────────────
# Terminal / colours
# ─────────────────────────────────────────────────────────────
set  -g default-terminal "tmux-256color"
set  -as terminal-features ",xterm-256color:RGB"   # truecolor passthrough
set  -g  set-clipboard on                          # copy to system clipboard (OSC 52)
set  -sg escape-time 10                            # don't swallow Alt/Esc chords
set  -g  focus-events on
# ─────────────────────────────────────────────────────────────
# Window sizing with multiple attached clients
# ─────────────────────────────────────────────────────────────
# ~/.local/bin/tmux-vscode runs `tmux new -A -s <dir>`, so every VS Code terminal
# in a folder attaches to the SAME session as a separate client. One in a hidden
# tab, or mid-reload, never gets a real size and sits at default-size (80x24);
# the default `window-size latest` then squeezes the window down to it — the
# flash, the shrink-then-grow, and the screen full of padding dots. `largest`
# pins the window to the biggest client and keeps COLUMNS matching the screen.
# It is a WINDOW option: check with `tmux show-options -gw | grep window-size`.
setw -g window-size largest
# ─────────────────────────────────────────────────────────────
# Scrollback
# ─────────────────────────────────────────────────────────────
# Default is only 2000 lines — this is why scrolling "stops early".
# NOTE: applies to panes created AFTER this loads. Existing panes keep the old limit.
set -g history-limit 50000
# ─────────────────────────────────────────────────────────────
# Mouse — click to focus, drag borders to resize, wheel to scroll
# ─────────────────────────────────────────────────────────────
set -g mouse on
# Wheel scrolls the pane instead of sending arrow keys to the shell
bind -n WheelUpPane   if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
# Double-click a word / triple-click a line to select it
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
# ─────────────────────────────────────────────────────────────
# Panes — Windows Terminal chords, no prefix needed
# ─────────────────────────────────────────────────────────────
# New panes open in the same directory you're currently in.
bind -n M-D split-window -h -c "#{pane_current_path}"   # Alt+Shift+D  split right
bind -n M-+ split-window -h -c "#{pane_current_path}"   # Alt+Shift+=  split right
bind -n M-_ split-window -v -c "#{pane_current_path}"   # Alt+Shift+-  split down
# Move focus:  Alt + arrow
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
# Resize:  Alt+Shift + arrow
bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up    resize-pane -U 5
bind -n M-S-Down  resize-pane -D 5
# Swap panes:  Ctrl+Alt+Shift + arrow    (focus follows the pane you moved)
# GNOME owns these by default for move-to-workspace. Freed with:
#   gsettings set org.gnome.desktop.wm.keybindings move-to-workspace-up "[]"
# Restore GNOME's defaults with `gsettings reset` on those four keys.
bind -n C-M-S-Left  swap-pane -s '{left-of}'
bind -n C-M-S-Right swap-pane -s '{right-of}'
bind -n C-M-S-Up    swap-pane -s '{up-of}'
bind -n C-M-S-Down  swap-pane -s '{down-of}'
# Toggle split orientation:  Alt+Shift+O
# Preserves nesting (unlike select-layout), but it is NOT a true equivalent of
# Windows Terminal's per-split flip — tmux can't rotate a single node of the
# layout tree. Known limits, all expected:
#   - reliable with 2 panes; with 3+ the ".-" target is the previous pane by
#     INDEX, which may not be the pane you're visually split with
#   - not an involution: move-pane rebuilds the layout, so a second press is a
#     new operation, not an undo
#   - in a short window (e.g. the VS Code panel) it can hit tmux's minimum pane
#     size and report "create pane failed, pane too small"
# Use Alt+Shift+P (next-layout) to get back to a sane arrangement.
bind -n M-O if -F '#{<:#{window_width},#{pane_width}}' 'move-pane -v -t .-' 'move-pane -h -t .-'
# Cycle tmux's preset layouts — main-horizontal / main-vertical keep one large
# pane plus a strip of smaller ones, closest to your "big top, two below" shape.
bind -n M-P next-layout
# Close pane. NOT Ctrl+Shift+W — Ptyxis intercepts that to close its own tab.
bind -n M-W kill-pane
# Zoom current pane to fullscreen and back
bind -n M-Z resize-pane -Z
# ─────────────────────────────────────────────────────────────
# Tabs (tmux calls them "windows")
# ─────────────────────────────────────────────────────────────
bind -n M-T new-window -c "#{pane_current_path}"   # Alt+Shift+T
bind -n M-Pagedown next-window
bind -n M-Pageup   previous-window
set  -g  base-index 1          # number tabs from 1, like Windows Terminal
setw -g  pane-base-index 1
set  -g  renumber-windows on
# ─────────────────────────────────────────────────────────────
# Scrolling / copy mode
# ─────────────────────────────────────────────────────────────
setw -g mode-keys vi
bind -n S-Pageup copy-mode -u          # Shift+PageUp enters scrollback directly
# In copy mode: v to select, y to yank, Escape to leave
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel
# Ctrl+L clears the screen AND wipes scrollback (matches a plain terminal)
bind -n C-l send-keys C-l \; run-shell "sleep 0.1" \; clear-history
# ─────────────────────────────────────────────────────────────
# Alt+Enter → newline instead of submit (for Claude CLI)
# ─────────────────────────────────────────────────────────────
# Same trick as the VS Code Shift+Enter keybinding: send a backslash,
# then Enter. Claude Code reads "\" + Enter as a line continuation.
# -H sends raw hex so the backslash can't be eaten by tmux's parser.
#
# Why Alt and not Shift: Ptyxis is VTE-based and does not report Shift+Enter
# as anything distinct from plain Enter, so tmux can never see it. Alt is
# transmitted as an ESC prefix unconditionally, so this always works.
# (Ctrl+J also inserts a newline in Claude with no config at all.)
bind -n M-Enter send-keys -H 5c 0d     # 5c = backslash, 0d = CR
# ─────────────────────────────────────────────────────────────
# Status bar - initial ones
# ─────────────────────────────────────────────────────────────
# set -g status-position bottom
# set -g status-style "bg=colour236,fg=colour250"
# set -g status-left  " #[bold]#S #[nobold]"
# set -g status-right " %H:%M  %d-%b "
# set -g window-status-current-style "bg=colour24,fg=colour255,bold"
# set -g pane-active-border-style "fg=colour39"
# ─────────────────────────────────────────────────────────────
# TESTING — powerline status bar (added 2026-08-08). Needs a Nerd
# Font active in Ptyxis's profile (JetBrainsMono Nerd Font) or the
# arrow glyphs render as boxes. To revert: delete this block and
# uncomment the plain version above.
# ─────────────────────────────────────────────────────────────
set -g status-position bottom
set -g status-style "bg=colour234,fg=colour250"
set -g status-left-length 60
set -g status-right-length 60
set -g status-left "#[bg=colour141,fg=colour235,bold] #S #[fg=colour141,bg=colour234,nobold]#[fg=colour109,bg=colour234]  #{b:pane_current_path} "
set -g window-status-current-format "#[fg=colour234,bg=colour212]#[fg=colour235,bg=colour212,bold] #I:#W #[fg=colour212,bg=colour234]"
set -g window-status-format " #I:#W "
set -g status-right "#[fg=colour234,bg=colour61]#[fg=colour255,bg=colour61] %H:%M #[fg=colour255,bg=colour61]%d-%b "
set -g pane-active-border-style "fg=colour39"
# Reload config
bind r source-file ~/.tmux.conf \; display-message "config reloaded"
# ─────────────────────────────────────────────────────────────
# Plugins — tpm (prefix + I installs, prefix + U updates)
# ─────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'          # auto-restore session when tmux next starts
set -g @continuum-save-interval '15'    # autosave every 15 min
# Keep this line at the very bottom of the file
run '~/.tmux/plugins/tpm/tpm'